[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-library-swch"
version = "0.1.3"
description = "AI helper utilities and models"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = "==3.12.3"
dependencies = [
	"annotated-types==0.7.0",
	"anyio==4.13.0",
	"cloudpathlib==0.24.0",
	"cloudpickle==3.1.2",
	"confection==1.3.3",
	"durationpy==0.10",
	"fastai==2.8.7",
	"fastcore==1.13.2",
	"fastprogress==1.1.6",
	"httpcore==1.0.9",
	"matplotlib==3.11.0",
	"mpmath==1.3.0",
	"numpy==2.4.6",
	"pandas==3.0.3",
	"preshed==3.0.13",
	"pyarrow==24.0.0",
	"pydantic_core==2.46.4",
	"PyYAML==6.0.3",
	"requests>=2.33.0",
	"requests-oauthlib==2.0.0",
	"scikit-learn==1.7.2",
	"setuptools==81.0.0",
	"swchmonclient>=0.2.0",
	"threadpoolctl==3.6.0",
	"torch==2.12.0",
	"torchaudio==2.11.0",
	"torchvision==0.27.0",
	"tsai==1.0.1",
	"typing-inspection==0.4.2",
	"typing_extensions==4.15.0",
	"xgboost==3.2.0",
]
