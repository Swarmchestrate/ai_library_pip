# Application Configuration
pipeline_type: "xgb"
window: 288
horizon: 96
stride: 96
prediction_target: "cpu_util_instance"
STANDARD_METRICS:
  - "cpu_util_instance"
  - "mean_cpu_util_prct"
  - "cpu_slo_upper"
  - "cpu_slo_lower"
cols_to_drop: ["ts"]
splits:
  [0.7, 0.1, 0.2]
gmlp:
  model_params:
    d_model: 64
    d_ffn: 128
    depth: 2
    patch_size: 1
    epochs: 1000
    lr: 0.001
    patience: 200
xgb:
  model_params:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.1
    reg_lambda: 1.0
    reg_alpha: 0.0
    tree_method: "hist"
    predictor: "cpu_predictor"
    random_state: 42
    n_jobs: -1
    objective: "reg:squarederror"
retrain_frequency: "30m"
data_frequency: "30s"
#parquet_path: "data/orchestrator_data/data.parquet"
parquet_path: "~/.local/share/ai_library/data.parquet"
#data_dir: "data/orchestrator_data/collector"
data_dir: "~/.local/share/ai_library/collector"
saved_files_dir: "~/.local/share/ai_library/saved_models"
poll_interval_seconds: 5.0
flush_max_rows: 5000
flush_max_seconds: 60.0
parquet_train_size: 100000
pivot_df: true

